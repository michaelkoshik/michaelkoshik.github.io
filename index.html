<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="color-scheme" content="dark light">
    
    <meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
    <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
    
    <title>Michael Koshik</title>
    
    <link rel="shortcut icon" href="assets/favicon.ico" type="image/x-icon">
    <link rel="apple-touch-icon" sizes="180x180" href="assets/images/logo-180x180.png">
    <link rel="icon" type="image/png" sizes="192x192" href="assets/images/logo-192x192.png">
    <link rel="icon" type="image/png" sizes="512x512" href="assets/images/logo-512x512.png">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Funnel+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">

    <style>
        :root {
            --bg-color: #000000;
            --text-main: #ffffff;
            --text-secondary: #a0a0a0;
        }

        @media (prefers-color-scheme: light) {
            :root {
                --bg-color: #ffffff;
                --text-main: #000000;
                --text-secondary: #666666;
            }
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-user-select: none;
            user-select: none;
            cursor: default;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: 'Funnel Sans', -apple-system, sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 30px;
            overflow: hidden;
            transition: background-color 0.3s ease, color 0.3s ease;
        }

        .container {
            display: flex;
            flex-direction: column;
            align-items: flex-start;
            text-align: left;
            gap: 16px;
            max-width: 420px;
            width: 100%;
            animation: fadeIn 0.8s ease-out forwards;
            opacity: 0;
            transform: translateY(15px);
        }

        @keyframes fadeIn {
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .avatar-container {
            width: 56px; 
            height: 56px;
            border-radius: 50%;
            overflow: hidden;
            border: 1px solid rgba(128, 128, 128, 0.2);
            margin-bottom: 8px;
        }
        
        .avatar-container img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .icon {
            width: 34px;
            height: 34px;
            color: var(--text-main);
            margin-bottom: 4px;
            animation: pulse 3s infinite ease-in-out;
            transition: color 0.3s ease;
        }

        @keyframes pulse {
            0% { opacity: 0.5; }
            50% { opacity: 1; }
            100% { opacity: 0.5; }
        }

        h1 {
            font-size: 2.2rem;
            font-weight: 700;
            letter-spacing: 0.5px;
            color: var(--text-main);
            line-height: 1.1;
            transition: color 0.3s ease;
        }

        p {
            color: var(--text-secondary);
            font-size: 1.05rem;
            line-height: 1.5;
            margin-top: 4px;
            transition: color 0.3s ease;
        }
    </style>
</head>
<body>

    <div class="container">
        
        <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" xmlns="http://www.w3.org/2000/svg">
            <circle cx="12" cy="12" r="10"></circle>
            <line x1="12" y1="8" x2="12" y2="12"></line>
            <line x1="12" y1="16" x2="12.01" y2="16"></line>
        </svg>
        
        <h1>Temporarily unavailable</h1>
        <p>Please come back later.</p>
    </div>

    <script>
        document.addEventListener('contextmenu', event => event.preventDefault());
    </script>
</body>
</html>
